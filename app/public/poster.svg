<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A night sky with a golden moon">
  <defs>
    <radialGradient id="sky" cx="50%" cy="8%" r="90%">
      <stop offset="0%" stop-color="#1b2450"/>
      <stop offset="52%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="moon" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fff6e2"/>
      <stop offset="45%" stop-color="#f0d9a8"/>
      <stop offset="100%" stop-color="#b98f4f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c47a" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#e8c47a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <g fill="#fff9eb">
    <circle cx="120" cy="140" r="1.7" opacity=".9"/><circle cx="300" cy="90" r="1.2" opacity=".7"/>
    <circle cx="470" cy="180" r="1.9" opacity=".85"/><circle cx="640" cy="80" r="1.1" opacity=".6"/>
    <circle cx="820" cy="150" r="1.6" opacity=".8"/><circle cx="1010" cy="105" r="1.3" opacity=".7"/>
    <circle cx="1105" cy="255" r="1.8" opacity=".85"/><circle cx="190" cy="330" r="1.1" opacity=".55"/>
    <circle cx="700" cy="300" r="1.4" opacity=".7"/><circle cx="930" cy="390" r="1.2" opacity=".6"/>
    <circle cx="60" cy="470" r="1.5" opacity=".7"/><circle cx="400" cy="520" r="1.1" opacity=".5"/>
  </g>
  <g fill="#e8c47a">
    <circle cx="255" cy="560" r="1.6" opacity=".8"/><circle cx="770" cy="520" r="1.7" opacity=".75"/>
    <circle cx="1060" cy="470" r="1.4" opacity=".7"/><circle cx="540" cy="420" r="1.2" opacity=".6"/>
  </g>
  <circle cx="600" cy="215" r="230" fill="url(#glow)"/>
  <circle cx="600" cy="210" r="96" fill="url(#moon)"/>
  <text x="600" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="46" letter-spacing="14" fill="#e8c47a" opacity=".92">FIABAMIA</text>
  <text x="600" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="22" fill="#f6ecd8" opacity=".55">a bedtime fairy tale</text>
</svg>
